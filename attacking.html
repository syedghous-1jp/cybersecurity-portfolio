<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Operations | Attack Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            background:#030303;
            color:#ff1a1a;
            font-family:'Rajdhani',sans-serif;
            text-align:center;
            padding:36px 16px 50px;
            overflow-x:hidden;
            min-height:100vh;
            position:relative;
        }

        #matrix-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.13; pointer-events:none; }
        #network-bg    { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:0.18; }
        body::after {
            content:''; position:fixed; top:0; left:0; width:100%; height:100%;
            background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,26,26,0.025) 2px,rgba(255,26,26,0.025) 4px);
            z-index:2; pointer-events:none;
        }

        .page-content { position:relative; z-index:10; }

        /* ── TITLE ── */
        .main-title {
            font-family:'Orbitron';
            font-size:clamp(20px, 3.8vw, 48px);
            letter-spacing:8px;
            margin-bottom:44px;
            text-transform:uppercase;
            color:#ff2020;
            text-shadow: 0 0 10px #ff0000, 0 0 30px #ff000099, 0 0 70px #ff000044;
            animation:titlePulse 3s ease-in-out infinite;
            position:relative;
        }
        .main-title::before {
            content:attr(data-text); position:absolute; left:50%; transform:translateX(-50%);
            color:#ff5050; filter:blur(1.5px); opacity:0.3; animation:glitch 5s infinite;
        }
        @keyframes glitch {
            0%,93%,100%{clip-path:none;transform:translateX(-50%)}
            94%{clip-path:polygon(0 15%,100% 15%,100% 35%,0 35%);transform:translateX(calc(-50% + 4px))}
            96%{clip-path:polygon(0 65%,100% 65%,100% 85%,0 85%);transform:translateX(calc(-50% - 4px))}
        }
        @keyframes titlePulse {
            0%,100%{text-shadow:0 0 10px #ff0000,0 0 30px #ff000099,0 0 70px #ff000044}
            50%    {text-shadow:0 0 20px #ff0000,0 0 55px #ff0000bb,0 0 100px #ff000055}
        }

        /* ── ROW — desktop: horizontal, mobile: vertical ── */
        .container {
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:stretch;
            gap:18px;
            flex-wrap:nowrap;
            perspective:2000px;
            margin-bottom:40px;
            width:100%;
            max-width:1380px;
            margin-left:auto;
            margin-right:auto;
            padding:0 10px;
        }

        /* ── CARD ── */
        .attack-box {
            flex:1 1 0;
            min-width:0;
            max-width:430px;
            height:300px;
            position:relative;
            cursor:pointer;
            transform-style:preserve-3d;
            transition:transform 0.5s cubic-bezier(0.23,1,0.32,1);
        }

        /* ── TABLET (2 columns + 1 below) ── */
        @media(max-width:900px){
            .container{
                flex-wrap:wrap;
                gap:16px;
            }
            .attack-box{
                flex:1 1 calc(50% - 16px);
                max-width:calc(50% - 8px);
                height:260px;
            }
            .attack-box:last-child{
                flex:1 1 100%;
                max-width:480px;
            }
        }

        /* ── MOBILE (single column, full width) ── */
        @media(max-width:560px){
            body{ padding:24px 12px 40px; }
            .main-title{ font-size:clamp(14px,6vw,28px); letter-spacing:4px; margin-bottom:28px; }
            .container{
                flex-direction:column;
                flex-wrap:nowrap;
                align-items:center;
                gap:14px;
                padding:0;
            }
            .attack-box{
                flex:none;
                width:100%;
                max-width:100%;
                /* On mobile keep landscape ratio: wider than tall */
                height:clamp(180px, 52vw, 240px);
            }
            .attack-box:last-child{
                max-width:100%;
            }
            .card-title{ font-size:12px; letter-spacing:2px; margin-bottom:8px; }
            .btn{ font-size:8px; padding:8px 16px; }
            .back-btn{ font-size:9px; padding:10px 28px; letter-spacing:2px; }
            .status-bar{ bottom:58px; }
            .icon-area{ bottom:65px; }
        }

        /* ── CARD FRAME ── */
        .card-frame {
            position:absolute; inset:0;
            border:2px solid rgba(255,26,26,0.7);
            background:linear-gradient(160deg,rgba(18,2,2,0.97) 0%,rgba(5,0,0,0.99) 100%);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-end;
            padding-bottom:22px;
            overflow:hidden;
            transition:border-color 0.4s, box-shadow 0.4s;
        }
        .attack-box:hover .card-frame {
            border-color:#ff5555;
            box-shadow:0 0 40px #ff000077,0 0 80px #ff000033,inset 0 0 40px #ff000015;
        }

        /* Corner brackets */
        .corner { position:absolute; width:20px; height:20px; border-color:#ff1a1a; border-style:solid; transition:all 0.4s; }
        .corner.tl{top:7px;left:7px;border-width:2px 0 0 2px}
        .corner.tr{top:7px;right:7px;border-width:2px 2px 0 0}
        .corner.bl{bottom:7px;left:7px;border-width:0 0 2px 2px}
        .corner.br{bottom:7px;right:7px;border-width:0 2px 2px 0}
        .attack-box:hover .corner{width:28px;height:28px;border-color:#ff5555}

        /* Edge glow bars */
        .edge-bar{position:absolute;left:8%;width:84%;height:4px;background:linear-gradient(90deg,transparent,#ff1a1a,transparent);box-shadow:0 0 14px #ff1a1a}
        .edge-bar.top{top:0} .edge-bar.bottom{bottom:0}

        /* Scan line */
        .scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff3030,transparent);opacity:0;z-index:20;pointer-events:none}
        .attack-box:hover .scan-line{opacity:1;animation:scanDown 1.8s linear infinite}
        @keyframes scanDown{from{top:0}to{top:100%}}

        /* ── ICON — fills card, leaves ~80px at bottom ── */
        .icon-area {
            position:absolute;
            top:0; left:0; right:0;
            bottom:78px;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        .icon-glow{
            position:absolute;
            width:80%;height:90%;
            border-radius:50%;
            background:radial-gradient(circle,rgba(255,30,30,0.12) 0%,transparent 70%);
            animation:glowPulse 2.5s ease-in-out infinite;
        }
        @keyframes glowPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

        .icon-svg{
            position:relative; z-index:2;
            width:90%; height:90%;
            filter:drop-shadow(0 0 10px #ff1a1a) drop-shadow(0 0 28px #ff000077);
            animation:iconFloat 3.5s ease-in-out infinite;
            transition:filter 0.4s;
        }
        .attack-box:hover .icon-svg{
            filter:drop-shadow(0 0 18px #ff4444) drop-shadow(0 0 45px #ff0000aa);
        }
        @keyframes iconFloat{
            0%,100%{transform:translateY(0) rotateY(0deg)}
            40%{transform:translateY(-6px) rotateY(5deg)}
            70%{transform:translateY(-3px) rotateY(-3deg)}
        }

        /* Data stream */
        .data-stream{
            position:absolute;right:6px;top:0;bottom:0;width:42px;
            overflow:hidden;font-family:'Courier New',monospace;font-size:7px;
            color:rgba(255,26,26,0.38);line-height:1.3;pointer-events:none;z-index:3;
        }
        .data-stream-inner{animation:streamScroll 7s linear infinite}
        .attack-box:nth-child(2) .data-stream-inner{animation-duration:5s}
        .attack-box:nth-child(3) .data-stream-inner{animation-duration:9s}
        @keyframes streamScroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}

        /* Status bar */
        .status-bar{position:absolute;bottom:68px;left:12px;right:52px;height:2px;background:rgba(255,26,26,0.1);overflow:hidden}
        .status-bar-fill{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff7070);box-shadow:0 0 6px #ff0000;animation:sbPulse 2s ease-in-out infinite}
        .attack-box:nth-child(1) .status-bar-fill{width:76%}
        .attack-box:nth-child(2) .status-bar-fill{width:61%;animation-delay:0.7s}
        .attack-box:nth-child(3) .status-bar-fill{width:89%;animation-delay:1.3s}
        @keyframes sbPulse{0%,100%{opacity:0.55}50%{opacity:1}}

        /* Title inside card */
        .card-title{
            font-family:'Orbitron';
            font-size:clamp(11px,1.2vw,17px);
            letter-spacing:3px;color:#ff3333;
            text-shadow:0 0 10px #ff000088;
            margin-bottom:12px;z-index:5;position:relative;
            transition:color 0.3s,text-shadow 0.3s;
        }
        .attack-box:hover .card-title{color:#ff7070;text-shadow:0 0 16px #ff0000,0 0 32px #ff000077}

        /* Button */
        .btn{
            padding:9px 22px;border:1.5px solid #ff1a1a;color:#ff1a1a;
            text-decoration:none;font-weight:700;font-family:'Orbitron';
            font-size:9px;letter-spacing:2px;background:transparent;
            position:relative;z-index:5;display:inline-block;
            text-transform:uppercase;overflow:hidden;transition:color 0.3s;
        }
        .btn::before{content:'';position:absolute;inset:0;background:#ff1a1a;transform:scaleX(0);transform-origin:left;transition:transform 0.35s;z-index:-1}
        .btn:hover::before{transform:scaleX(1)}
        .btn:hover{color:#000;box-shadow:0 0 22px #ff0000,0 0 44px #ff000055}

        /* Back btn */
        .back-btn{
            display:inline-block;margin-top:14px;padding:12px 50px;
            border:1.5px solid rgba(255,26,26,0.4);color:rgba(255,26,26,0.7);
            text-decoration:none;font-family:'Orbitron';letter-spacing:4px;font-size:10px;
            transition:all 0.4s;
        }
        .back-btn:hover{border-color:#ff1a1a;color:#ff1a1a;box-shadow:0 0 22px #ff000033;background:rgba(255,26,26,0.05)}


    </style>
</head>

<script>
// MATRIX RAIN
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
function rsz(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
rsz(); window.addEventListener('resize',()=>{rsz();drops=Array(Math.floor(canvas.width/13)).fill(1);});
const chars='01アイウエオカキクケコサシスセソタチツテトABCDEF0123456789';
let drops=Array(Math.floor(canvas.width/13)).fill(1);
function dm(){
    ctx.fillStyle='rgba(3,3,3,0.06)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ff1a1a'; ctx.font='12px monospace';
    drops.forEach((y,i)=>{
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*13,y*13);
        if(y*13>canvas.height&&Math.random()>0.975)drops[i]=0; drops[i]++;
    });
}
setInterval(dm,48);

// NETWORK BG
const svgEl=document.getElementById('network-bg');
const W=window.innerWidth,H=window.innerHeight;
svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
const pts=Array.from({length:22},()=>({x:Math.random()*W,y:Math.random()*H}));
pts.forEach((p,i)=>{
    pts.forEach((q,j)=>{
        if(j>i){const d=Math.hypot(p.x-q.x,p.y-q.y);
            if(d<250){const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
                ln.setAttribute('x1',p.x);ln.setAttribute('y1',p.y);ln.setAttribute('x2',q.x);ln.setAttribute('y2',q.y);
                ln.setAttribute('stroke','#ff1a1a');ln.setAttribute('stroke-width','0.7');
                ln.setAttribute('opacity',(1-d/250)*0.4);svgEl.appendChild(ln);}
        }
    });
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','2.5');
    c.setAttribute('fill','#ff1a1a');c.setAttribute('opacity','0.4');svgEl.appendChild(c);
});

// DATA STREAMS
function buildStream(id){
    const el=document.getElementById(id);let s='';
    for(let i=0;i<150;i++)s+=(Math.random()>.5?'1':'0')+(Math.random()>.6?Math.floor(Math.random()*9):'')+(Math.random()>.85?' ':'')+'\n';
    el.textContent=s+s;
}
['ds1','ds2','ds3'].forEach(buildStream);

// MOUSE TILT — desktop only
if(window.matchMedia('(hover:hover)').matches){
    document.querySelectorAll('.attack-box').forEach(box=>{
        box.addEventListener('mousemove',e=>{
            const r=box.getBoundingClientRect();
            const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
            box.style.transform=`rotateY(${x*18}deg) rotateX(${-y*14}deg) translateZ(28px)`;
            box.style.transition='transform 0.1s';
        });
        box.addEventListener('mouseleave',()=>{
            box.style.transition='transform 0.6s cubic-bezier(0.23,1,0.32,1)';
            box.style.transform='';
        });
    });
}
</script>
