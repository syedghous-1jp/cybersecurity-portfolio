<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Operations | Attack Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#050505; color:#ff1a1a; font-family:'Rajdhani',sans-serif; text-align:center; padding:50px 20px; overflow-x:hidden; }
        
        h1 { font-family:'Orbitron'; font-size:45px; letter-spacing:10px; margin-bottom:80px; text-transform:uppercase; text-shadow:0 0 20px #ff1a1a; }

        .container { display:flex; justify-content:center; gap:60px; flex-wrap:wrap; perspective: 1500px; }
        
        /* 3D Cube Card Style */
        .attack-box { 
            width: 350px; height: 350px; background:rgba(10,0,0,0.8); 
            border: 2px solid #ff1a1a; position:relative;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }
        
        /* Glowing Border effect */
        .attack-box:hover { 
            transform: scale(1.1) translateZ(50px); 
            box-shadow: 0 0 50px #ff1a1a; 
            border-color: #ffcccc;
        }

        .attack-box h2 { font-family:'Orbitron'; font-size:26px; margin-bottom:30px; letter-spacing:2px; }
        
        .btn { 
            margin-top:20px; padding:15px 30px; border:2px solid #ff1a1a; 
            color:#ff1a1a; text-decoration:none; font-weight:bold; 
            transition: 0.4s; background:transparent; font-family:'Orbitron';
        }
        .btn:hover { background:#ff1a1a; color:#000; box-shadow: 0 0 20px #ff1a1a; cursor:pointer; }
        
        /* Back Button */
        .back-btn { margin-top:100px; padding:15px 50px; border:2px solid #ff1a1a; color:#ff1a1a; text-decoration:none; font-family:'Orbitron'; letter-spacing:3px; display:inline-block; }
        .back-btn:hover { background:#ff1a1a; color:#000; }
    </style>
</head>
<body>

    <h1>SELECT ATTACK TARGET</h1>

    <div class="container">
        <div class="attack-box">
            <h2>PC HACKING</h2>
            <a href="pc-attacks.html" class="btn">VIEW METHODS</a>
        </div>

        <div class="attack-box">
            <h2>MOBILE HACKING</h2>
            <a href="mobile-attacks.html" class="btn">VIEW METHODS</a>
        </div>

        <div class="attack-box">
            <h2>NETWORK HACKING</h2>
            <a href="network-attacks.html" class="btn">VIEW METHODS</a>
        </div>
    </div>

    <a href="malware.html" class="back-btn">← BACK TO LAB</a>

</body>
</html>
