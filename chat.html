<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKERS ROOM-LIVE CHAT</title>
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: #111827;
            --neon-blue: #00d2ff;
            --neon-green: #00ff66;
            --text-main: #e2e8f0;
            --text-muted: #8892b0;
            --border: #1f2937;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .container { 
            max-width: 900px; 
            width: 100%;
            margin: 0 auto; 
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: var(--neon-blue);
            text-align: center;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        /* The Big Interactive Booth Controller */
        .booth-gate {
            background: var(--bg-card);
            border: 2px dashed var(--neon-blue);
            border-radius: 8px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .booth-gate:hover {
            border-style: solid;
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            transform: scale(1.02);
        }

        .booth-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .booth-desc {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-click-btn {
            background: none;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 30px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 4px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .booth-gate:hover .action-click-btn {
            background: var(--neon-green);
            border-color: var(--neon-green);
            color: var(--bg-deep);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* Hidden Core Chat Section - Opens on Click */
        .chat-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: none; /* Shuru me chhupa rahega */
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            height: 65vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header-node {
            background: rgba(17, 24, 39, 0.8);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #dedicated-chat-logs {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #070a0f;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dash-msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            word-wrap: break-word;
        }

        .dash-msg-me {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-end;
            border-right: 3px solid #ffffff;
        }

        .dash-msg-them {
            color: var(--neon-blue);
            background: rgba(0, 210, 255, 0.03);
            align-self: flex-start;
            border-left: 3px solid var(--neon-blue);
        }

        .dash-input-area {
            display: flex;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
        }

        #dash-chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 18px;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .dash-send-btn {
            background: none;
            border-left: 1px solid var(--border);
            color: var(--neon-green);
            padding: 0 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--neon-blue);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <a href="labs-hub.html" class="back-home">&lt;= RETURN_TO_DASHBOARD</a>

    <div class="container">
        <h1>Matrix Tactical Comms</h1>

        <div id="comms-booth-gate" class="booth-gate" onclick="openLiveBooth()">
            <div class="booth-title">[ ENTER LIVE COMMS BOOTH ]</div>
            <div class="booth-desc">Click anywhere on this node terminal to establish a secure decentralized line with active operation agents. No installation required.</div>
            <span class="action-click-btn">Connect Line</span>
        </div>

        <div id="active-chat-box" class="chat-section">
            <div class="chat-header-node">
                <span style="color: var(--neon-blue); font-weight: bold; font-size: 14px; letter-spacing: 2px;">⚡ NODE_SECURE_LIVE</span>
                <span id="dash-user-badge" style="color: var(--neon-green); font-size: 12px;">CONNECTING...</span>
            </div>
            <div id="dedicated-chat-logs"></div>
            <div class="dash-input-area">
                <input type="text" id="dash-chat-input" placeholder="Type tactical message...">
                <button onclick="sendDashMessage()" class="dash-send-btn">Transmit</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        let dashUsername = "";
        let dashDatabase;

        const firebaseConfig = {
            apiKey: "AIzaSyA5TbH7MzFE9bCGVMGs3qoRuyg2KeTqeBA",
            authDomain: "malware-lab-chat.firebaseapp.com",
            databaseURL: "https://malware-lab-chat-default-rtdb.firebaseio.com",
            projectId: "malware-lab-chat",
            storageBucket: "malware-lab-chat.firebasestorage.app",
            messagingSenderId: "987488388086",
            appId: "1:987488388086:web:86bd5d241efcb9b3483dd7"
        };

        firebase.initializeApp(firebaseConfig);
        dashDatabase = firebase.database();

        // Yeh function click hote hi chalega aur booth open karega
        function openLiveBooth() {
            // Booth gate ko chhupa do aur chat box ko flex display dekar open kar do
            document.getElementById("comms-booth-gate").style.display = "none";
            document.getElementById("active-chat-box").style.display = "flex";

            // Initialize Background User Stream
            const randomID = Math.floor(100 + Math.random() * 900);
            dashUsername = "HACKER_" + randomID;
            document.getElementById("dash-user-badge").innerText = `● AGENT: ${dashUsername}`;

            // Sync Data Stream
            dashDatabase.ref('direct_messages').limitToLast(50).on('child_added', (snapshot) => {
                const data = snapshot.val();
                renderDashNode(data.user, data.msg, data.user === dashUsername);
            });
        }

        function sendDashMessage() {
            const input = document.getElementById("dash-chat-input");
            const text = input.value.trim();
            if(text !== "") {
                dashDatabase.ref('direct_messages').push({
                    user: dashUsername,
                    msg: text,
                    time: Date.now()
                });
                input.value = "";
            }
        }

        function renderDashNode(sender, text, isMe) {
            const logs = document.getElementById("dedicated-chat-logs");
            const node = document.createElement("div");
            node.className = isMe ? "dash-msg dash-msg-me" : "dash-msg dash-msg-them";
            node.innerHTML = isMe ? 
                `<span style="color:var(--text-muted); font-size:10px; display:block; margin-bottom:3px;">[YOU]</span>\${text}` : 
                `<span style="color:var(--neon-green); font-size:10px; display:block; margin-bottom:3px;">[\${sender}]</span>\${text}`;
            logs.appendChild(node);
            logs.scrollTop = logs.scrollHeight;
        }

        document.getElementById("dash-chat-input").addEventListener("keypress", function(e){ if(e.key === 'Enter') sendDashMessage(); });
    </script>
</body>
</html>
