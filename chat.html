<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Practice Arena :: Comms Booth</title>
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: #111827;
            --neon-blue: #00d2ff;
            --neon-green: #00ff66;
            --text-main: #e2e8f0;
            --text-muted: #8892b0;
            --border: #1f2937;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .container { 
            max-width: 1100px; 
            width: 100%;
            margin: 0 auto; 
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: var(--neon-blue);
            text-align: center;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* Interactive Booth Gate */
        .booth-gate {
            background: var(--bg-card);
            border: 2px dashed var(--neon-blue);
            border-radius: 8px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .booth-gate:hover {
            border-style: solid;
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            transform: scale(1.02);
        }

        .booth-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .booth-desc {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-click-btn {
            background: none;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 30px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 4px;
            display: inline-block;
        }

        .booth-gate:hover .action-click-btn {
            background: var(--neon-green);
            border-color: var(--neon-green);
            color: var(--bg-deep);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* MASSIVE CHAT WINDOW SCREEN */
        .chat-section {
            background: var(--bg-card);
            border: 2px solid var(--neon-blue);
            border-radius: 8px;
            display: none; 
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            height: 75vh;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .chat-header-node {
            background: rgba(17, 24, 39, 0.9);
            padding: 18px 24px;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #dedicated-chat-logs {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #06090e;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .dash-msg {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            word-wrap: break-word;
            position: relative;
        }

        .dash-msg-me {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            align-self: flex-end;
            border-right: 4px solid #ffffff;
        }

        .dash-msg-them {
            color: var(--neon-blue);
            background: rgba(0, 210, 255, 0.04);
            align-self: flex-start;
            border-left: 4px solid var(--neon-blue);
        }

        /* Render Image Styling */
        .chat-shared-img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 4px;
            border: 1px solid var(--neon-blue);
            margin-top: 8px;
            display: block;
        }

        .chat-url-link {
            color: var(--neon-green);
            text-decoration: underline;
            font-weight: bold;
        }

        .del-msg-btn {
            background: none;
            border: none;
            color: #ff0055;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .del-msg-btn:hover {
            background: #ff0055;
            color: #ffffff;
        }

        .dash-input-area {
            display: flex;
            align-items: center;
            border-top: 2px solid var(--border);
            background: var(--bg-card);
        }

        #dash-chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            outline: none;
        }

        .dash-send-btn {
            background: var(--neon-blue);
            border: none;
            color: #000000;
            padding: 22px 35px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .dash-send-btn:hover {
            background: var(--neon-green);
            box-shadow: -5px 0 15px rgba(0, 255, 102, 0.3);
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--neon-blue);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">&lt;= RETURN_TO_DASHBOARD</a>

    <div class="container">
        <h1>Matrix Tactical Comms</h1>

        <div id="comms-booth-gate" class="booth-gate" onclick="openLiveBooth()">
            <div class="booth-title">[ ENTER HACKERS ROOM]</div>
            <div class="booth-desc">WELCOME HACKERS IN CHATBOOTH--SHARE YOUR KNOWLEDGE AND IDEAS WITH OTHERS.</div>
            <span class="action-click-btn">Connect Line</span>
        </div>

        <div id="active-chat-box" class="chat-section">
            <div class="chat-header-node">
                <span style="color: var(--neon-blue); font-weight: bold; font-size: 15px; letter-spacing: 2px;">⚡ CHAT / SHARE</span>
                <span id="dash-user-badge" style="color: var(--neon-green); font-size: 13px; font-weight: bold;">CONNECTING...</span>
            </div>
            
            <div id="dedicated-chat-logs"></div>
            
            <div class="dash-input-area">
                <input type="text" id="dash-chat-input" placeholder="Type text or paste image/file URL...">
                <button onclick="sendDashMessage()" class="dash-send-btn">Transmit</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        let dashUsername = "";
        let dashDatabase;

        const firebaseConfig = {
            apiKey: "AIzaSyA5TbH7MzFE9bCGVMGs3qoRuyg2KeTqeBA",
            authDomain: "malware-lab-chat.firebaseapp.com",
            databaseURL: "https://malware-lab-chat-default-rtdb.firebaseio.com",
            projectId: "malware-lab-chat",
            storageBucket: "malware-lab-chat.firebasestorage.app",
            messagingSenderId: "987488388086",
            appId: "1:987488388086:web:86bd5d241efcb9b3483dd7"
        };

        firebase.initializeApp(firebaseConfig);
        dashDatabase = firebase.database();

        function openLiveBooth() {
            document.getElementById("comms-booth-gate").style.display = "none";
            document.getElementById("active-chat-box").style.display = "flex";

            const randomID = Math.floor(100 + Math.random() * 900);
            dashUsername = "HACKER_" + randomID;
            document.getElementById("dash-user-badge").innerText = "● AGENT: " + dashUsername;

            const chatRef = dashDatabase.ref('direct_messages');
            
            chatRef.limitToLast(50).on('child_added', (snapshot) => {
                renderDashNode(snapshot.key, snapshot.val());
            });

            chatRef.on('child_removed', (snapshot) => {
                const nodeToRemove = document.getElementById("msg-" + snapshot.key);
                if(nodeToRemove) nodeToRemove.remove();
            });
        }

        function sendDashMessage() {
            const input = document.getElementById("dash-chat-input");
            const text = input.value.trim();
            if(text !== "") {
                dashDatabase.ref('direct_messages').push({
                    user: dashUsername,
                    msg: text,
                    time: Date.now()
                });
                input.value = "";
            }
        }

        function deleteThisMessage(msgID) {
            dashDatabase.ref('direct_messages/' + msgID).remove();
        }

        // Auto detecting image extensions system
        function isImageURL(url) {
            return (url.match(/\.(jpeg|jpg|gif|png|webp|svg)$/) != null) || url.includes("images");
        }

        // Auto detecting regular standard links
        function isStandardURL(url) {
            return url.startsWith("http://") || url.startsWith("https://");
        }

        function renderDashNode(msgID, data) {
            const logs = document.getElementById("dedicated-chat-logs");
            if(document.getElementById("msg-" + msgID)) return;

            const node = document.createElement("div");
            node.id = "msg-" + msgID;
            
            const isMe = data.user === dashUsername;
            node.className = isMe ? "dash-msg dash-msg-me" : "dash-msg dash-msg-them";
            
            let processedContent = data.msg;

            // Smart Link Parser Engine
            if (isStandardURL(data.msg)) {
                if (isImageURL(data.msg)) {
                    processedContent = '<img src="' + data.msg + '" class="chat-shared-img" alt="External Shared Payload"/>';
                } else {
                    processedContent = '<a href="' + data.msg + '" target="_blank" class="chat-url-link">[🔗 EXTERNAL LINK SOURCE]</a>';
                }
            }

            if(isMe) {
                node.innerHTML = '<span style="color:var(--text-muted); font-size:10px; display:block; margin-bottom:3px;">[YOU] <button class="del-msg-btn" onclick="deleteThisMessage(\'' + msgID + '\')">[DEL]</button></span>' + processedContent;
            } else {
                node.innerHTML = '<span style="color:var(--neon-green); font-size:10px; display:block; margin-bottom:3px;">[' + data.user + ']</span>' + processedContent;
            }
            
            logs.appendChild(node);
            logs.scrollTop = logs.scrollHeight;
        }

        document.getElementById("dash-chat-input").addEventListener("keypress", function(e){ if(e.key === 'Enter') sendDashMessage(); });
    </script>
</body>
</html>
