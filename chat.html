<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Room - Live Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            font-family: 'Space Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header Styling */
        header {
            background: rgba(0, 210, 255, 0.05);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-text {
            color: #00d2ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }
        .status {
            color: #00ff66;
            font-size: 12px;
            font-weight: bold;
        }
        .back-btn {
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #8b949e;
            padding: 5px 12px;
            border-radius: 4px;
            transition: 0.3s;
        }
        .back-btn:hover {
            color: #00d2ff;
            border-color: #00d2ff;
        }
        /* Chat Frame Styling */
        .chat-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0d1117;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <span class="logo-text">⚡ HACKER_ROOM v3.0</span>
            <span class="status"> ● LIVE_NODE</span>
        </div>
        <a href="index.html" class="back-btn">← Back to Terminal</a>
    </header>

    <div class="chat-container">
    <iframe src="https://www3.minnit.chat/MalwareLabChat?embed&&nickname=&theme=dark&transparent=1" 
            allow="geolocation; microphone; camera; display-capture">
    </iframe>
</div>
</body>
</html>
