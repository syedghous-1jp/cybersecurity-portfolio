<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Lab Terminal</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: 'Courier New', monospace; padding: 20px; }
        .terminal-box { max-width: 800px; margin: 30px auto; background: #111827; border: 1px solid #1f2937; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); overflow: hidden; }
        .terminal-header { background: #1f2937; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff66; }
        .dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
        .dot-1 { background: #ff5f56; } .dot-2 { background: #ffbd2e; } .dot-3 { background: #27c93f; }
        .lang-switch button { background: #374151; border: 1px solid #4b5563; color: #fff; padding: 5px 12px; cursor: pointer; border-radius: 4px; font-family: inherit; }
        .lang-switch button.active { background: #00ff66; color: #0d1117; font-weight: bold; }
        .terminal-body { padding: 25px; }
        .lang-content { display: none; }
        .lang-content.active { display: block; }
        .instructions { background: #1f2937; padding: 15px; border-left: 4px solid #00d2ff; border-radius: 4px; margin-bottom: 20px; line-height: 1.6; }
        input[type="text"] { background: #0b0f19; border: 1px solid #4b5563; color: #00ff66; padding: 12px; width: 65%; border-radius: 4px; font-family: inherit; font-size: 16px; }
        button.submit-btn { background: #00d2ff; color: #0b0f19; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; font-family: inherit; }
        button.submit-btn:hover { box-shadow: 0 0 15px #00d2ff; }
        .status-msg { margin-top: 15px; font-weight: bold; font-size: 16px; }
        /* FLAG{inspect_element_success_2026} */
    </style>
</head>
<body>

<div class="terminal-box">
    <div class="terminal-header">
        <div class="dots"><span class="dot-1"></span><span class="dot-2"></span><span class="dot-3"></span></div>
        <div style="font-weight: bold; color: #00d2ff;" id="lab-title">Loading Lab...</div>
        <div class="lang-switch">
            <button id="btn-en" class="active" onclick="switchLang('en')">English</button>
            <button id="btn-ur" onclick="switchLang('ur')">Roman Urdu</button>
        </div>
    </div>

    <div class="terminal-body">
        <div id="content-en" class="lang-content active">
            <h3>📖 Lab Instructions</h3>
            <div class="instructions" id="desc-en">Loading...</div>
        </div>

        <div id="content-ur" class="lang-content">
            <h3>📖 Lab Hidayat (Guide)</h3>
            <div class="instructions" id="desc-ur">Loading...</div>
        </div>

        <div style="margin-top: 30px; border-top: 1px solid #1f2937; padding-top: 20px;">
            <p style="color: #8b949e; margin-bottom: 10px;">Enter the captured Flag below:</p>
            <input type="text" id="flag-input" placeholder="FLAG{...}">
            <button class="submit-btn" onclick="validateFlag()">Submit Flag</button>
            <div id="status" class="status-msg"></div>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="labs-hub.html" style="color: #8b949e; text-decoration: none; font-size: 14px;">← Back to Dashboard</a>
        </div>
    </div>
</div>

<script>
    const labsData = {
        "1": {
            title: "Lab 0x01: Source Code Recon",
            correctFlag: "FLAG{inspect_element_success_2026}",
            en: "<strong>Mission:</strong> The developer left a secret password inside the source code comments of this very page. Right-click anywhere, select <strong>'Inspect'</strong> or <strong>'View Page Source'</strong>, find the hidden flag structure, and paste it below to clear the lab!",
            ur: "<strong>Mission:</strong> Developer ne is page ke HTML source code ke andar ek khufia password comment mein chupa diya hai. Page par kahin bhi right-click karo, <strong>'Inspect'</strong> ya <strong>'View Page Source'</strong> select karo, aur code mein se chhupa hua flag dhoond kar niche submit karo!"
        },
        "2": {
            title: "Lab 0x02: Crypto Breakout",
            correctFlag: "FLAG{linux_king_2026}",
            en: "<strong>Mission:</strong> An intercepted ciphertext reads: <code>RkxBR3tsaW51eF9raW5nXzIwMjZ9</code>. Intelligence reports confirm this is encoded using <strong>Base64</strong>. Use your Linux terminal (e.g., <code>echo 'text' | base64 -d</code>) or an online decoder to crack the cipher and submit the raw flag.",
            ur: "<strong>Mission:</strong> Hamein ek hacker ka khufia message mila hai jo yeh hai: <code>RkxBR3tsaW51eF9raW5nXzIwMjZ9</code>. Pata chala hai ke yeh text <strong>Base64</strong> tool se encode kiya gaya hai. Apna Linux terminal open karo aur command <code>echo 'text' | base64 -d</code> use kar ke isay decode karo aur asli flag submit karo!"
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const currentLabId = urlParams.get('lab') || "1";
    const lab = labsData[currentLabId];

    if(lab) {
        document.getElementById('lab-title').innerText = lab.title;
        document.getElementById('desc-en').innerHTML = lab.en;
        document.getElementById('desc-ur').innerHTML = lab.ur;
    }

    function switchLang(lang) {
        document.querySelectorAll('.lang-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.lang-switch button').forEach(el => el.classList.remove('active'));
        document.getElementById(`content-${lang}`).classList.add('active');
        document.getElementById(`btn-${lang}`).classList.add('active');
    }

    function validateFlag() {
        const input = document.getElementById('flag-input').value.trim();
        const status = document.getElementById('status');
        if (input === lab.correctFlag) {
            status.innerHTML = "🎉 EXCELLENT WORK! Sahi jawab. Tumhara score update kar diya gaya hai!";
            status.style.color = "#00ff66";
        } else {
            status.innerHTML = "❌ ACCESS DENIED! Ghalat flag. Dubara koshish karo.";
            status.style.color = "#ff3366";
        }
    }
</script>
</body>
</html>
