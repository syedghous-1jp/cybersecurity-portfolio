<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><title>Mobile Hacking | Operations Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    
    <script type="text/javascript">
        // 1. Right-click disable
        document.addEventListener('contextmenu', event => event.preventDefault());
        // 2. Copy/Cut disable
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        // 3. Shortcuts (Save, Source, Copy, Print, Inspect) disable
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.keyCode === 83 || e.keyCode === 85 || e.keyCode === 67 || e.keyCode === 80 || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // F12 disable
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
        });
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: #020202; 
            color: #ff1a1a; 
            font-family: 'Rajdhani', sans-serif; 
            padding: 40px;
            overflow-x: hidden;
            /* TEXT SELECTION LOCK */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        h1 { 
            font-family: 'Orbitron'; 
            font-size: 50px; 
            text-align: center; 
            margin-bottom: 60px; 
            text-shadow: 0 0 20px #ff1a1a;
            letter-spacing: 5px;
        }

        .category-box { margin-bottom: 60px; }
        
        .section-title { 
            font-family: 'Orbitron'; 
            color: #fff; 
            font-size: 28px; 
            margin-bottom: 30px; 
            border-left: 5px solid #ff1a1a; 
            padding-left: 15px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            perspective: 1000px;
        }

        .card { 
            height: 160px; 
            background: linear-gradient(145deg, #0a0000, #150000); 
            border: 1px solid #ff1a1a; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 20px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .card:hover { 
            transform: translateY(-10px) rotateX(10deg); 
            box-shadow: 0 15px 30px #ff1a1a; 
            border-color: #fff;
            color: #fff;
        }

        .card span { font-family: 'Orbitron'; font-weight: bold; font-size: 16px; text-align: center; }

        .back-btn { 
            display: block; 
            width: 200px; 
            margin: 50px auto; 
            padding: 15px; 
            text-align: center; 
            border: 2px solid #ff1a1a; 
            color: #ff1a1a; 
            text-decoration: none; 
            font-family: 'Orbitron'; 
            transition: 0.3s;
        }
        .back-btn:hover { background: #ff1a1a; color: #000; }
    </style>
</head>
<body>
<h1>MOBILE HACKING OPERATIONS</h1>

    <div class="category-box">
        <h2 class="section-title">MOBILE VS PC HACKING</h2>
        <div class="grid">
           <div class="card" onclick="window.location.href='android_ios.pdf'">
                <span>ANDROID vs iOS</span>
            </div>
             <div class="card" onclick="window.location.href='root_by.pdf'">
                <span>WHY ROOT/ JAILBREAK?</span>
            </div>
             <div class="card" onclick="window.location.href='real_phone.pdf'">
                <span>BUILD YOUR OWN LAB (real phone + emulator</span>
            </div>
             <div class="card" onclick="window.location.href='essential_tools.pdf'">
                <span>ESSENTIAL TOOLS:ADB,TERMUX,MAGISK,CYDIA</span></span>
            </div>
 <div class="card" onclick="window.location.href='dangerous_perm.pdf'">
                <span>DANGEROUS PERMISSIONS EXPLAINED</span>
            </div>
             </div>
    </div>
